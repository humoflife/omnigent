[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omnigent-discord"
version = "0.12.0.dev0"
description = "Discord gateway bot that drives Omnigent sessions."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.21.0",
    "aiohttp>=3.12.0",
    "cryptography>=42.0.0",
    "discord-py>=2.4.0",
    "httpx>=0.28.0",
    "pydantic-settings>=2.10.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/omnigent_discord"]
